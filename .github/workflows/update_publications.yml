name: Update Publications

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update script
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || vars.GOOGLE_SCHOLAR_ID || '_-1UOnoAAAAJ' }}
          SEMANTIC_SCHOLAR_ID: ${{ secrets.SEMANTIC_SCHOLAR_ID || vars.SEMANTIC_SCHOLAR_ID || '79375083' }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python update_publications.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "chore: auto-update publications from Google Scholar" || echo "No changes to commit"
          git push
